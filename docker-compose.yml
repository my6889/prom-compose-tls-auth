services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    volumes:
      - './prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
      - './ssl-auth-config/web-auth.yml:/etc/web-auth.yml'
      - './ssl-auth-config/server.crt:/etc/server.crt:ro'
      - './ssl-auth-config/server.key:/etc/server.key:ro'
      - './prometheus/rules:/etc/prometheus/rules'
      - 'prom-tsdb:/prometheus'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.config.file=/etc/web-auth.yml'
      - '--storage.tsdb.retention.time=360d'
    ports:
      - 9090:9090
    restart: always
    networks:
      - prom
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    volumes:
      - './alertmanager:/etc/alertmanager'
      - './ssl-auth-config/web-auth.yml:/etc/web-auth.yml'
      - './ssl-auth-config/server.crt:/etc/server.crt:ro'
      - './ssl-auth-config/server.key:/etc/server.key:ro'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--web.config.file=/etc/web-auth.yml'
    ports:
      - 9093:9093
    restart: always
    networks:
      - prom

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    volumes:
      - 'grafana-pv:/var/lib/grafana'
    ports:
      - 3000:3000
    restart: always
    networks:
      - prom
    depends_on:
      - prometheus

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox_exporter
    volumes:
      - ./blackbox_exporter:/etc/blackbox_exporter
      - './ssl-auth-config/web-auth.yml:/etc/web-auth.yml'
      - './ssl-auth-config/server.crt:/etc/server.crt:ro'
      - './ssl-auth-config/server.key:/etc/server.key:ro'
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.config.file=/etc/web-auth.yml'
    ports:
      - 9115:9115
    restart: always
    networks:
      - prom

volumes:
  grafana-pv:
    driver: local
  prom-tsdb:
    driver: local

networks:
  prom:
    ipam:
      driver: default
      config:
      - subnet: "172.21.18.0/24"